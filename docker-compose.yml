services:
  apiext-fs:
    image: ${APIEXT_FS_IMAGE:-apiext-fs:local}
    build:
      context: .
      dockerfile: Apiext.Fs/Dockerfile
    container_name: apiext-fs
    restart: unless-stopped
    ports:
      - "${APIEXT_FS_PORT:-9000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      StoreLocation: /datastore
      ConnectionStrings__DefaultConnection: "Data Source=/appdata/apiext-fs.db"
      UseStaticAccount: "true"
      StaticUser: "${APIEXT_FS_USER:-iouser}"
      StaticPassword: "${APIEXT_FS_PASSWORD:-iopassword}"
    volumes:
      - apiext-fs-data:/datastore
      - apiext-fs-app:/appdata

volumes:
  apiext-fs-data:
  apiext-fs-app:
